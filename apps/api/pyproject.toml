[project]
name = "coach-api"
version = "0.0.0"
description = "FastAPI backend: content/run/feedback + /music/resolve + /me playlist resolution."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pyrefly", "ruff"]

[tool.pyrefly]
strict = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# T-10: the schema/migration suite. Runs the DB-free shape + DDL checks always; the live DB
# round-trip SKIPS when DATABASE_URL is unset (a Testcontainers Postgres lands later).
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
